<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>管理画面 — 華耀東夷堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1420;
    --bg-dark:   #060a10;
    --accent:    #c8a060;
    --accent-dk: #8a6a3a;
    --text:      #f0ece4;
    --text-sub:  #ddd6c8;
    --text-weak: #9aa0b0;
    --muted:     #5a6278;
    --faint:     #3a4058;
    --sidebar:   #0b0f1a;
    --header:    #0d1220;
    --active:    #1a2236;
    --hover:     #141b2a;
    --danger:    #c05050;
    --success:   #50a878;
  }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── ログイン画面 ── */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .login-card {
    background: var(--header);
    border: 1px solid var(--faint);
    border-radius: 10px;
    padding: 36px 32px;
    width: 100%;
    max-width: 360px;
  }
  .login-card h1 {
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .login-card p {
    font-size: 12px;
    color: var(--text-weak);
    margin-bottom: 24px;
  }
  .login-error {
    color: #e06060;
    font-size: 13px;
    margin-bottom: 12px;
    display: none;
  }
  .form-group {
    margin-bottom: 14px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--text-weak);
    margin-bottom: 5px;
  }
  .form-group input {
    width: 100%;
    padding: 9px 12px;
    background: var(--active);
    border: 1px solid var(--faint);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
  }
  .form-group input:focus { border-color: var(--accent-dk); }

  /* ── ボタン共通 ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 14px;
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: opacity .15s;
    white-space: nowrap;
  }
  .btn:hover { opacity: .85; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary  { background: var(--accent-dk); color: var(--text); }
  .btn-accent   { background: var(--accent); color: #111; font-weight: 700; }
  .btn-danger   { background: var(--danger); color: #fff; }
  .btn-success  { background: var(--success); color: #111; }
  .btn-ghost    { background: var(--faint); color: var(--text-sub); }
  .btn-full { width: 100%; justify-content: center; padding: 10px; font-size: 14px; }

  /* ── 管理画面レイアウト ── */
  #admin-screen { display: none; min-height: 100vh; }

  .adm-header {
    background: var(--header);
    border-bottom: 1px solid var(--faint);
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .adm-header-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
  }
  .adm-header-user {
    font-size: 12px;
    color: var(--text-weak);
    font-family: 'IBM Plex Mono', monospace;
  }

  .adm-nav {
    background: var(--sidebar);
    border-bottom: 1px solid var(--faint);
    display: flex;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .adm-nav::-webkit-scrollbar { display: none; }
  .adm-nav-btn {
    flex-shrink: 0;
    padding: 12px 16px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-weak);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
    white-space: nowrap;
  }
  .adm-nav-btn:hover { color: var(--text-sub); }
  .adm-nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .adm-body { padding: 16px; max-width: 900px; margin: 0 auto; }

  .adm-section { display: none; }
  .adm-section.active { display: block; }

  .adm-section-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--faint);
  }

  /* ── 検索バー ── */
  .search-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .search-bar input, .search-bar select {
    padding: 7px 10px;
    background: var(--active);
    border: 1px solid var(--faint);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    flex: 1;
    min-width: 120px;
  }
  .search-bar input:focus, .search-bar select:focus { border-color: var(--accent-dk); }
  .search-bar select option { background: var(--bg); }

  /* ── テーブル ── */
  .adm-table-wrap {
    overflow-x: auto;
    border: 1px solid var(--faint);
    border-radius: 8px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    background: var(--sidebar);
    color: var(--text-weak);
    text-align: left;
    padding: 9px 12px;
    font-weight: 500;
    border-bottom: 1px solid var(--faint);
    white-space: nowrap;
  }
  td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--faint);
    color: var(--text-sub);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--hover); }

  .td-mono {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-weak);
  }
  .td-body {
    max-width: 280px;
    word-break: break-all;
    white-space: pre-wrap;
  }
  .td-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── フォームカード ── */
  .adm-card {
    background: var(--header);
    border: 1px solid var(--faint);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .adm-card h3 {
    font-size: 14px;
    color: var(--text-sub);
    margin-bottom: 12px;
  }
  .adm-card .form-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .adm-card input, .adm-card select, .adm-card textarea {
    flex: 1;
    min-width: 160px;
    padding: 8px 10px;
    background: var(--active);
    border: 1px solid var(--faint);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    resize: vertical;
  }
  .adm-card input:focus, .adm-card select:focus, .adm-card textarea:focus {
    border-color: var(--accent-dk);
  }
  .adm-card select option { background: var(--bg); }

  /* ── バッジ ── */
  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
  }
  .badge-closed  { background: #3a2020; color: #e08080; }
  .badge-active  { background: #1a3a24; color: #70c878; }
  .badge-resolved { background: #1a2e3a; color: #70aac8; }
  .badge-pending { background: #3a2e18; color: #c8a060; }

  /* ── ページネーション ── */
  .pagination {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-weak);
  }

  /* ── 統計 ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stats-card {
    background: var(--header);
    border: 1px solid var(--faint);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }
  .stats-card .num {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
  }
  .stats-card .label {
    font-size: 12px;
    color: var(--text-weak);
    margin-top: 4px;
  }
  .stats-link-card {
    background: var(--header);
    border: 1px solid var(--accent-dk);
    border-radius: 8px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-decoration: none;
    transition: background .15s;
  }
  .stats-link-card:hover { background: var(--active); }
  .stats-link-card .info h3 { font-size: 14px; color: var(--accent); margin-bottom: 4px; }
  .stats-link-card .info p  { font-size: 12px; color: var(--text-weak); }
  .stats-link-card .arrow   { font-size: 20px; color: var(--accent); }

  /* ── 並び順変更 ── */
  .order-btns { display: flex; gap: 4px; }

  /* ── ローディング / 空 ── */
  .adm-loading, .adm-empty {
    padding: 24px;
    text-align: center;
    color: var(--text-weak);
    font-size: 13px;
  }

  /* ── モバイル調整 ── */
  @media (max-width: 600px) {
    .adm-body { padding: 12px; }
    .td-body { max-width: 160px; }
    .adm-card .form-row { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login-screen">
  <div class="login-card">
    <h1>🔐 管理画面</h1>
    <p>華耀東夷堂 — 管理者専用</p>
    <div class="login-error" id="login-error"></div>
    <div class="form-group">
      <label>メールアドレス</label>
      <input type="email" id="login-email" placeholder="admin@example.com" autocomplete="username">
    </div>
    <div class="form-group">
      <label>パスワード</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-accent btn-full" id="login-btn">ログイン</button>
  </div>
</div>

<!-- 管理画面 -->
<div id="admin-screen">
  <header class="adm-header">
    <span class="adm-header-title">⚙ 華耀東夷堂 管理</span>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="adm-header-user" id="admin-user-email"></span>
      <button class="btn btn-ghost" id="logout-btn" style="padding:5px 10px;font-size:12px">ログアウト</button>
    </div>
  </header>

  <nav class="adm-nav">
    <button class="adm-nav-btn active" data-tab="posts">📝 投稿管理</button>
    <button class="adm-nav-btn" data-tab="threads">💬 スレッド管理</button>
    <button class="adm-nav-btn" data-tab="boards">📋 板管理</button>
    <button class="adm-nav-btn" data-tab="users">🚫 ユーザー管理</button>
    <button class="adm-nav-btn" data-tab="reports">🚨 通報管理</button>
    <button class="adm-nav-btn" data-tab="stats">📊 統計</button>
  </nav>

  <div class="adm-body">

    <!-- 投稿管理 -->
    <section class="adm-section active" id="tab-posts">
      <div class="adm-section-title">📝 投稿管理</div>
      <div class="search-bar">
        <select id="post-filter-board"><option value="">板: すべて</option></select>
        <select id="post-filter-thread"><option value="">スレッド: すべて</option></select>
        <input type="text" id="post-filter-id" placeholder="ID で絞り込み">
        <input type="text" id="post-filter-keyword" placeholder="キーワード検索">
        <button class="btn btn-primary" id="post-search-btn">検索</button>
      </div>
      <div id="posts-table-wrap">
        <div class="adm-loading">読み込み中…</div>
      </div>
      <div class="pagination" id="posts-pagination"></div>
    </section>

    <!-- スレッド管理 -->
    <section class="adm-section" id="tab-threads">
      <div class="adm-section-title">💬 スレッド管理</div>
      <div class="adm-card">
        <h3>スレッド作成</h3>
        <div class="form-row">
          <select id="new-thread-board"><option value="">板を選択</option></select>
          <input type="text" id="new-thread-title" placeholder="スレッドタイトル">
          <textarea id="new-thread-body" placeholder="本文（1投稿目）" rows="2"></textarea>
          <button class="btn btn-accent" id="new-thread-btn">作成</button>
        </div>
      </div>
      <div class="search-bar">
        <select id="thread-filter-board"><option value="">板: すべて</option></select>
        <input type="text" id="thread-filter-keyword" placeholder="タイトル検索">
        <button class="btn btn-primary" id="thread-search-btn">検索</button>
      </div>
      <div id="threads-table-wrap">
        <div class="adm-loading">読み込み中…</div>
      </div>
      <div class="pagination" id="threads-pagination"></div>
    </section>

    <!-- 板管理 -->
    <section class="adm-section" id="tab-boards">
      <div class="adm-section-title">📋 板管理</div>
      <div class="adm-card">
        <h3>板を追加</h3>
        <div class="form-row">
          <input type="text" id="new-board-emoji" placeholder="絵文字 (例: 🎯)" style="max-width:90px;flex:none">
          <input type="text" id="new-board-name" placeholder="板名">
          <input type="text" id="new-board-slug" placeholder="スラッグ (英小文字)">
          <button class="btn btn-accent" id="new-board-btn">追加</button>
        </div>
      </div>
      <div id="boards-table-wrap">
        <div class="adm-loading">読み込み中…</div>
      </div>
    </section>

    <!-- ユーザー管理 -->
    <section class="adm-section" id="tab-users">
      <div class="adm-section-title">🚫 ユーザー管理 (ID BAN)</div>
      <div class="adm-card">
        <h3>ID をBANする</h3>
        <div class="form-row">
          <input type="text" id="new-ban-id" placeholder="anon_id (8文字)">
          <input type="text" id="new-ban-reason" placeholder="理由（任意）">
          <button class="btn btn-danger" id="new-ban-btn">BAN</button>
        </div>
      </div>
      <div class="adm-card" style="margin-top:0">
        <h3>投稿履歴で検索</h3>
        <div class="form-row">
          <input type="text" id="user-history-id" placeholder="anon_id">
          <button class="btn btn-primary" id="user-history-btn">投稿履歴を見る</button>
        </div>
      </div>
      <div class="adm-section-title" style="margin-top:16px;font-size:14px">BANリスト</div>
      <div id="bans-table-wrap">
        <div class="adm-loading">読み込み中…</div>
      </div>
      <div id="user-history-wrap" style="margin-top:16px"></div>
    </section>

    <!-- 通報管理 -->
    <section class="adm-section" id="tab-reports">
      <div class="adm-section-title">🚨 通報管理</div>
      <div class="search-bar">
        <select id="report-filter-status">
          <option value="">すべて</option>
          <option value="pending">未対応</option>
          <option value="resolved">対応済み</option>
        </select>
        <button class="btn btn-primary" id="report-search-btn">絞り込み</button>
      </div>
      <div id="reports-table-wrap">
        <div class="adm-loading">読み込み中…</div>
      </div>
    </section>

    <!-- 統計 -->
    <section class="adm-section" id="tab-stats">
      <div class="adm-section-title">📊 統計</div>
      <div class="stats-grid" id="stats-grid">
        <div class="stats-card"><div class="num" id="stat-boards">-</div><div class="label">板</div></div>
        <div class="stats-card"><div class="num" id="stat-threads">-</div><div class="label">スレッド</div></div>
        <div class="stats-card"><div class="num" id="stat-posts">-</div><div class="label">投稿</div></div>
        <div class="stats-card"><div class="num" id="stat-bans">-</div><div class="label">BAN中ID</div></div>
        <div class="stats-card"><div class="num" id="stat-reports">-</div><div class="label">未対応通報</div></div>
      </div>
      <a href="https://analytics.google.com" target="_blank" rel="noopener" class="stats-link-card">
        <div class="info">
          <h3>Google Analytics</h3>
          <p>アクセス解析・ユーザー行動データを確認</p>
        </div>
        <span class="arrow">↗</span>
      </a>
    </section>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
